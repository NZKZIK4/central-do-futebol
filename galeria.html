      <h2 id="titulo-principal">Momentos do futebol</h2>
      <p class="destaque">O futebol também é feito de imagens, torcida e grandes momentos.</p>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 20px 0;">
        <figure style="margin: 0; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px;">
          <img src="img/gol.jpeg" alt="Comemoração de gol decisivo no estádio" style="width: 100%; height: 150px; object-fit: cover; border-radius: 6px;">
          <figcaption style="margin-top: 8px; font-size: 0.95rem;"><strong>Gol decisivo:</strong> A emoção de balançar as redes no estádio lotado.</figcaption>
        </figure>

        <figure style="margin: 0; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px;">
          <img src="img/torcida.jpeg" alt="Torcida vibrando nas arquibancadas" style="width: 100%; height: 150px; object-fit: cover; border-radius: 6px;">
          <figcaption style="margin-top: 8px; font-size: 0.95rem;"><strong>Festa nas arquibancadas:</strong> Bandeiras e apoio incondicional da torcida.</figcaption>
        </figure>

      </div>

      <button onclick="mostrarAviso()">Clique aqui</button>
      <p id="resposta"></p>
